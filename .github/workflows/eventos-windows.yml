name: Instalador MEIF Eventos (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['eventos-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: eventos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: MEIF-Eventos-instalador
          path: eventos/release/*.exe
      - name: Publicar descarga (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eventos-v1.0.0
          target_commitish: ${{ github.sha }}
          name: MEIF Eventos 1.0.0 – Instalador para Windows
          make_latest: true
          body: |
            Instalador de **MEIF Eventos** para Windows 10/11 (64 bits). Funciona sin internet.

            1. Descargue `MEIF-Eventos-Setup-1.0.0.exe` (abajo, en «Assets»).
            2. Ábralo. Si Windows muestra «Windows protegió su PC», pulse «Más información» › «Ejecutar de todas formas».
            3. Siga el asistente; queda el ícono MEIF Eventos en el escritorio.

            Manual de usuario: eventos/docs/MANUAL_USUARIO.md
          files: eventos/release/*.exe
