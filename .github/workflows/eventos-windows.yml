name: Instalador MEIF Eventos (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['eventos-v*']

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: eventos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: MEIF-Eventos-instalador
          path: eventos/release/*.exe
